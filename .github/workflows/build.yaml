name: Build Valkey Operator

on:
  workflow_dispatch:
    inputs:
      operator_version:
        description: "Operator image tag to publish (e.g. v0.1.0)"
        required: true
        default: "latest"
      platforms:
        description: "Target platforms (comma-separated)"
        required: true
        default: "linux/amd64,linux/arm64"
      push_latest:
        description: "Also tag as :latest"
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image and tags
        id: meta
        run: |
          owner="${{ github.repository_owner }}"
          image="${REGISTRY,,}/${owner,,}/valkey-operator"
          ver="${{ inputs.operator_version }}"
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:${ver}"
            if [ "${{ inputs.push_latest }}" = "true" ]; then echo "${image}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=valkey-operator-${{ inputs.operator_version }}
          cache-to: type=gha,mode=max,scope=valkey-operator-${{ inputs.operator_version }}

      - name: Summary
        run: |
          {
            echo "### Built Valkey Operator image"
            echo ""
            echo "**Version:** ${{ inputs.operator_version }}"
            echo "**Platforms:** ${{ inputs.platforms }}"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
